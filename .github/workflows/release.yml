name: Build and Release AIR Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build portable Windows app
        run: npm run build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-build-${{ github.run_number }}
          name: AIR Browser build ${{ github.run_number }}
          body: Automated Windows portable build from commit ${{ github.sha }}.
          files: dist/*.exe
          make_latest: true
