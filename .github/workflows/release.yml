name: Build and Release AIR Browser (Native Windows)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: air-browser-native-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/AIRBrowser.WinUI/AIRBrowser.WinUI.csproj

      - name: Publish native Windows app
        run: dotnet publish src/AIRBrowser.WinUI/AIRBrowser.WinUI.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o publish

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/* -DestinationPath artifacts/AIR-Browser-Windows11-Portable.zip -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer/AIRBrowser.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-native-build-${{ github.run_number }}
          name: AIR Browser Native build ${{ github.run_number }}
          body: |
            Native Windows 11 AIR Browser build.
            - Installer: AIR-Browser-Setup.exe
            - Portable package: AIR-Browser-Windows11-Portable.zip
            Built from commit ${{ github.sha }}.
          files: |
            artifacts/AIR-Browser-Setup.exe
            artifacts/AIR-Browser-Windows11-Portable.zip
          make_latest: true
