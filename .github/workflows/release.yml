name: Build and Release AIR Browser (Native Windows)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'website/**'
      - 'installer/**'
      - 'assets/**'
      - 'global.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: air-browser-native-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    env:
      AIR_VERSION: 0.2.${{ github.run_number }}
      AIR_SIGNING_CERT_BASE64: ${{ secrets.AIR_SIGNING_CERT_BASE64 }}
      AIR_SIGNING_CERT_PASSWORD: ${{ secrets.AIR_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild src/AIRBrowser.WinUI/AIRBrowser.WinUI.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Publish native Windows app
        shell: pwsh
        run: |
          $publishDir = (Join-Path $PWD "publish") + [IO.Path]::DirectorySeparatorChar
          New-Item -ItemType Directory -Force $publishDir | Out-Null
          msbuild src/AIRBrowser.WinUI/AIRBrowser.WinUI.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsAppSDKSelfContained=true "/p:PublishDir=$publishDir"

      - name: Download and verify fixed WebView2 runtime
        shell: pwsh
        run: |
          $version = "156.0.4314.56"
          $cab = Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.$version.x64.cab"
          $url = "https://github.com/ciderapp/WebView2-Archives/releases/download/$version/Microsoft.WebView2.FixedVersionRuntime.$version.x64.cab"
          $expectedSha256 = "f37590235285774860146bdece4439532e3574303c0508ae4cf457ea584f125f"
          Invoke-WebRequest -Uri $url -OutFile $cab
          $actualSha256 = (Get-FileHash -Path $cab -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Fixed WebView2 CAB checksum mismatch. Expected $expectedSha256, got $actualSha256"
          }
          $fixedRoot = Join-Path $PWD "publish/FixedRuntime"
          New-Item -ItemType Directory -Force $fixedRoot | Out-Null
          & expand.exe $cab "-F:*" $fixedRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the fixed WebView2 runtime CAB." }
          $runtimeExe = Join-Path $fixedRoot "Microsoft.WebView2.FixedVersionRuntime.$version.x64/msedgewebview2.exe"
          if (!(Test-Path $runtimeExe)) { throw "The extracted fixed WebView2 runtime is incomplete." }
          Set-Content -Path (Join-Path $PWD "publish/FixedRuntimeVersion.txt") -Value $version -NoNewline
          Write-Host "Bundled WebView2 Fixed Version $version ($actualSha256)"

      - name: Sign application binaries (when certificate is configured)
        if: ${{ env.AIR_SIGNING_CERT_BASE64 != '' && env.AIR_SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          AIR_SIGNING_CERT_BASE64: ${{ secrets.AIR_SIGNING_CERT_BASE64 }}
          AIR_SIGNING_CERT_PASSWORD: ${{ secrets.AIR_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "air-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:AIR_SIGNING_CERT_BASE64))
          $sdkRoot = "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin"
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw "Windows SDK SignTool was not found." }
          $files = Get-ChildItem "publish" -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" }
          foreach ($file in $files) {
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:AIR_SIGNING_CERT_PASSWORD $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($file.FullName)" }
          }
          Remove-Item $certPath -Force

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $portable = "artifacts/AIR-Browser-Portable"
          New-Item -ItemType Directory -Force $portable | Out-Null
          Copy-Item -Path "publish/*" -Destination $portable -Recurse -Force
          New-Item -ItemType File -Force "$portable/portable.mode" | Out-Null
          Compress-Archive -Path "$portable/*" -DestinationPath "artifacts/AIR-Browser-Portable.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          & $iscc installer/AIRBrowser.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer (when certificate is configured)
        if: ${{ env.AIR_SIGNING_CERT_BASE64 != '' && env.AIR_SIGNING_CERT_PASSWORD != '' }}
        shell: pwsh
        env:
          AIR_SIGNING_CERT_BASE64: ${{ secrets.AIR_SIGNING_CERT_BASE64 }}
          AIR_SIGNING_CERT_PASSWORD: ${{ secrets.AIR_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "air-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:AIR_SIGNING_CERT_BASE64))
          $sdkRoot = "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin"
          $signTool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw "Windows SDK SignTool was not found." }
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:AIR_SIGNING_CERT_PASSWORD "artifacts/AIR-Browser-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          Remove-Item $certPath -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-native-build-${{ github.run_number }}
          name: AIR Browser Native build ${{ github.run_number }}
          body: |
            Native Windows 11 AIR Browser build.
            - Installer: AIR-Browser-Setup.exe (updates preserve installed browser data)
            - Portable: AIR-Browser-Portable.zip (stores browser data beside the app)
            - Bundled WebView2 Fixed Version runtime: 156.0.4314.56 x64 (no separate Evergreen runtime required)
            Built from commit ${{ github.sha }}.
          files: |
            artifacts/AIR-Browser-Setup.exe
            artifacts/AIR-Browser-Portable.zip
          make_latest: true
