name: Build AIR Browser for Linux and macOS

on:
  push:
    branches: [main]
    paths:
      - 'cross-platform/**'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-browser-cross-platform
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            command: npx electron-builder --linux AppImage deb
          - platform: macos
            os: macos-latest
            command: npx electron-builder --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-platform/package.json

      - name: Install dependencies
        working-directory: cross-platform
        run: npm install --no-audit --no-fund

      - name: Build installers
        working-directory: cross-platform
        run: ${{ matrix.command }}

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: air-browser-${{ matrix.platform }}
          path: cross-platform/dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Linux and macOS downloads
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-browser-cross-platform-${{ github.run_number }}
          name: AIR Browser Cross-Platform build ${{ github.run_number }}
          body: |
            Separate Electron-based desktop edition for Linux and macOS.
            Linux: AppImage and Debian package.
            macOS: Intel and Apple Silicon DMG/ZIP builds.
            This is a separate app from the native Windows edition. Initial macOS builds are not code-signed or notarized.
            Built from commit ${{ github.sha }}.
          files: release-files/*
          make_latest: false
